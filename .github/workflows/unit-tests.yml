name: unit-tests

on:
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TripleP.Backend.slnx

      - name: Build
        run: dotnet build TripleP.Backend.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/TripleP.Backend.Tests.Logic -c Release --no-build
