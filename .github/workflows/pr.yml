name: pr

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TripleP.Backend.slnx

      - name: Build
        run: dotnet build TripleP.Backend.slnx -c Release --no-restore

      - name: Format
        run: dotnet format TripleP.Backend.slnx --verify-no-changes

  unit-tests:
    name: Unit tests
    needs: build
    uses: ./.github/workflows/unit-tests.yml

  database-tests:
    name: Database tests
    needs: build
    uses: ./.github/workflows/database-tests.yml
