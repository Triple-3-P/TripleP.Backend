services:
  app:
    build:
      context: ./src
      dockerfile: TripleP.Backend.Web/Dockerfile
    container_name: triplep-app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PostgresConnection: Host=db;Port=5432;Database=triplep;Username=triplep;Password=triplep
    ports:
      - "8080:8080"
    # Apply pending EF Core migrations with the bundle built in the Dockerfile, then start the API.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - './efbundle --connection "$$ConnectionStrings__PostgresConnection" && exec dotnet TripleP.Backend.Web.dll'
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: triplep-db
    environment:
      POSTGRES_DB: triplep
      POSTGRES_USER: triplep
      POSTGRES_PASSWORD: triplep
    ports:
      - "5432:5432"
    # Data lives in RAM only: every start begins with an empty database, so the app
    # re-applies migrations (and later seeds) instead of reusing stale local data.
    tmpfs:
      - /var/lib/postgresql/data:size=1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triplep -d triplep"]
      interval: 5s
      timeout: 5s
      retries: 10
